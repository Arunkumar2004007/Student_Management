<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student management{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% if session.user %}
<header class="top">
  <strong>Student management</strong>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('view_students') }}">Students</a>
    <a href="{{ url_for('add_student') }}">Add student</a>
  </nav>
  <form method="post" action="{{ url_for('logout') }}" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <span class="muted">{{ session.user }} ({{ session.role }})</span>
    <button class="btn ghost sm">Sign out</button>
  </form>
</header>
{% endif %}
<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}" role="status">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
